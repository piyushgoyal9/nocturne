
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Musify</title>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="utility.css">
</head>

<body>

    <div class="container flex bg-black">

        <!-- Left Section -->
        <div class="left">

            <div class="home bg-grey rounded m-1 p-1">

                <!-- Optional Logo -->
                <!-- <img class="invert" src="img/logo.svg" alt="Musify Logo"> -->

                <ul>
                    <li>
                        <img class="invert" src="img/home.svg" alt="Home">
                        Home
                    </li>

                    <li>
                        <img class="invert" src="img/search.svg" alt="Search">
                        Search
                    </li>
                </ul>

            </div>

            <div class="library bg-grey rounded p-1">

                <div class="heading">
                    <img class="invert" src="img/playlist.svg" alt="Library">
                    <h2>Your Library</h2>
                </div>

                <div class="footer">
                    <div><span>Legal</span></div>
                    <div><span>Privacy Policy</span></div>
                    <div><span>Cookies</span></div>
                    <div><span>About Ads</span></div>
                    <div><span>Accessibility</span></div>
                    <div><span>Cookies</span></div>
                </div>

            </div>

        </div>

        <!-- Right Section -->
        <div class="right bg-grey rounded">

            <div class="header">

                <div class="nav">

                    <svg class="invert"
                        xmlns="http://www.w3.org/2000/svg"
                        viewBox="0 0 24 24"
                        width="24"
                        height="24"
                        fill="none">

                        <path d="M15 6C15 6 9 10.4189 9 12C9 13.5812 15 18 15 18"
                            stroke="currentColor"
                            stroke-width="1.5"
                            stroke-linecap="round"
                            stroke-linejoin="round" />
                    </svg>

                    <svg class="invert"
                        xmlns="http://www.w3.org/2000/svg"
                        viewBox="0 0 24 24"
                        width="24"
                        height="24"
                        fill="none">

                        <path d="M9 6C9 6 15 10.4189 15 12C15 13.5812 9 18 9 18"
                            stroke="currentColor"
                            stroke-width="1.5"
                            stroke-linecap="round"
                            stroke-linejoin="round" />
                    </svg>

                </div>

                <div class="button">
                    <button>Sign Up</button>
                    <button>Log In</button>
                </div>

            </div>

            <div class="spotify-playlists">

                <h1>Musify Playlists</h1>

                <div class="cardcontainer">

                    <div class="card">
                        <img src="https://i.scdn.co/image/ab67706f000000026e515187c071e45918e9f0de" alt="Dinner with Friends">

                        <h2>Dinner with Friends</h2>

                        <p>
                            The perfect soundtrack to those long nights over dinner.
                        </p>
                    </div>

                    <div class="card">
                        <img src="https://i.scdn.co/image/ab67706f000000026e515187c071e45918e9f0de" alt="Dinner with Friends">

                        <h2>Dinner with Friends</h2>

                        <p>
                            The perfect soundtrack to those long nights over dinner.
                        </p>
                    </div>

                </div>

            </div>

        </div>

    </div>

</body>

</html>
