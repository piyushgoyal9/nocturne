
<script>
    const GOOGLE_CLIENT_ID =
        "687284331652-tgq1ea8aj5sgnfihek8nbmk4oumkbbep.apps.googleusercontent.com";

    function initializeGoogleButton() {
        const container = document.getElementById("google-button");

        if (!container) {
            console.error("Google button container not found.");
            return;
        }

        if (!window.google?.accounts?.id) {
            container.textContent = "Google sign-in failed to load.";
            console.error("Google Identity Services script is unavailable.");
            return;
        }

        if (typeof window.handleGoogleLogin !== "function") {
            container.textContent = "Google login handler is unavailable.";
            console.error("handleGoogleLogin is not defined.");
            return;
        }

        try {
            google.accounts.id.initialize({
                client_id: GOOGLE_CLIENT_ID,
                callback: window.handleGoogleLogin,
                auto_select: false
            });

            container.innerHTML = "";

            google.accounts.id.renderButton(container, {
                type: "standard",
                theme: "outline",
                size: "large",
                text: "continue_with",
                shape: "rectangular",
                logo_alignment: "left",
                width: 300
            });
        } catch (error) {
            console.error("Google button initialization failed:", error);
            container.textContent = "Unable to initialize Google sign-in.";
        }
    }

    function waitForGoogleScript() {
        const script = document.querySelector(
            'script[src="https://accounts.google.com/gsi/client"]'
        );

        if (window.google?.accounts?.id) {
            initializeGoogleButton();
            return;
        }

        if (!script) {
            console.error("Google Identity Services script tag not found.");
            return;
        }

        script.addEventListener("load", initializeGoogleButton, { once: true });

        script.addEventListener("error", () => {
            const container = document.getElementById("google-button");
            if (container) {
                container.textContent =
                    "Google sign-in couldn't load. Check your connection.";
            }
        }, { once: true });
    }

    waitForGoogleScript();
</script>
