
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | Nocturne</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: #090909;
            color: #fff;
            font-family: Arial, sans-serif;
        }

        .reset-card {
            width: 100%;
            max-width: 420px;
            padding: 36px;
            background: #151515;
            border: 1px solid #292929;
            border-radius: 16px;
        }

        .logo {
            color: #b89aff;
            font-size: 28px;
            font-weight: 800;
            letter-spacing: 2px;
            margin-bottom: 28px;
        }

        h1 {
            font-size: 26px;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #aaa;
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 26px;
        }

        label {
            display: block;
            font-size: 14px;
            margin: 18px 0 8px;
        }

        input {
            width: 100%;
            padding: 13px;
            background: #222;
            color: white;
            border: 1px solid #444;
            border-radius: 8px;
            outline: none;
        }

        input:focus {
            border-color: #b89aff;
        }

        button {
            width: 100%;
            margin-top: 24px;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #b89aff;
            color: #111;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        #message {
            margin-top: 18px;
            font-size: 14px;
            line-height: 1.5;
            overflow-wrap: anywhere;
        }

        .back-link {
            display: block;
            margin-top: 22px;
            color: #b89aff;
            text-align: center;
            text-decoration: none;
            font-size: 14px;
        }
    </style>
</head>

<body>
    <main class="reset-card">
        <div class="logo">NOCTURNE</div>

        <h1>Reset your password</h1>
        <p class="subtitle">
            Choose a new password for your Nocturne account.
            Your new password must contain at least 8 characters.
        </p>

        <form id="reset-form">
            <label for="password">New password</label>
            <input
                type="password"
                id="password"
                minlength="8"
                maxlength="128"
                autocomplete="new-password"
                placeholder="Enter new password"
                required
            >

            <label for="confirm-password">Confirm new password</label>
            <input
                type="password"
                id="confirm-password"
                minlength="8"
                maxlength="128"
                autocomplete="new-password"
                placeholder="Re-enter new password"
                required
            >

            <button type="submit" id="submit-button">
                Reset Password
            </button>
        </form>

        <p id="message" role="status" aria-live="polite"></p>

        <a class="back-link" href="index.html">
            Back to Nocturne
        </a>
    </main>

    <script>
        const API_URL =
            window.location.hostname === "localhost" ||
            window.location.hostname === "127.0.0.1"
                ? "http://localhost:5000"
                : "https://nocturne-backend-omnp.onrender.com";

        const form = document.getElementById("reset-form");
        const passwordInput = document.getElementById("password");
        const confirmInput = document.getElementById("confirm-password");
        const message = document.getElementById("message");
        const button = document.getElementById("submit-button");

        const params = new URLSearchParams(window.location.search);
        const token = params.get("token");

        if (!token) {
            message.textContent =
                "Reset token is missing. Please request a new password reset email.";
            message.style.color = "#ff7777";
            form.hidden = true;
        }

        form.addEventListener("submit", async (event) => {
            event.preventDefault();

            const password = passwordInput.value;
            const confirmPassword = confirmInput.value;

            if (password.length < 8 || password.length > 128) {
                message.textContent =
                    "Password must be between 8 and 128 characters.";
                message.style.color = "#ff7777";
                return;
            }

            if (password !== confirmPassword) {
                message.textContent = "Passwords do not match.";
                message.style.color = "#ff7777";
                confirmInput.focus();
                return;
            }

            button.disabled = true;
            button.textContent = "Resetting...";
            message.textContent = "";

            try {
                const response = await fetch(
                    `${API_URL}/api/auth/reset-password`,
                    {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify({
                            token,
                            password
                        })
                    }
                );

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(
                        data.message || "Unable to reset password."
                    );
                }

                message.textContent =
                    data.message ||
                    "Password reset successful! You can now log in.";
                message.style.color = "#83e6a0";

                form.reset();
                form.hidden = true;
            } catch (error) {
                message.textContent =
                    error.message ||
                    "Could not connect to the server. Please try again.";
                message.style.color = "#ff7777";
            } finally {
                button.disabled = false;
                button.textContent = "Reset Password";
            }
        });
    </script>
</body>
</html>
